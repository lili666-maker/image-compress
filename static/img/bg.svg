<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- 极淡的抽象渐变背景：白底 + 四团柔光晕，中心提亮保证内容区域干净 -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#f4f7fb"/>
  <g filter="url(#soft)">
    <circle cx="240" cy="170" r="340" fill="#276ef1" fill-opacity="0.15"/>
    <circle cx="1200" cy="140" r="300" fill="#06b6d4" fill-opacity="0.12"/>
    <circle cx="1330" cy="720" r="340" fill="#8b5cf6" fill-opacity="0.10"/>
    <circle cx="170" cy="780" r="310" fill="#38bdf8" fill-opacity="0.12"/>
    <circle cx="720" cy="450" r="480" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
